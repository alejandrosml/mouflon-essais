# Le Floucat : un Mérinos d'Arles blanc de cinq à six ans, mâle castré,
# tondu au printemps, au départ de la transhumance en juin. Les quatre
# flocs, les cornes et le redon suivent docs/races/merinos-d-arles.md.
# Comportements du Mannequin réglés sur le § 8 : apprivoisé, marcheur,
# très grégaire ; il mène le troupeau et ne charge pas.

[pet]
# Un floucat, mâle castré : le moteur n'a pas de valeur pour un castrat. Il
# est déclaré mâle, sans ce qui n'appartient qu'au bélier entier : ni
# flehmen, ni charge de rut (voir plus bas). Le bélier, la brebis et
# l'agneau de sa race sont dans pets/merinos-d-arles : un castrat n'a ni
# brebis ni agneau à lui.
sex = "male"
id = "floucat"
name = "Floucat"
author = "Alejandro San Martin Lamas"
description = "Le floucat, mâle castré Mérinos d'Arles qui mène le troupeau : velours crème tondu, quatre flocs à rubans rouges, cornes pâles et redon sur un collier de bois. Apprivoisé et grand marcheur, il mène les troupeaux transhumants de Provence."
version = "0.1.0"
license = "MIT OR Apache-2.0"
category = "sheep"
region = "france"

[appearance]
rig = "floucat.svg"
# Une unité = un centimètre ; 75 cm au garrot osseux, environ 102,4 cm
# jusqu'au haut des cornes et du toupet : 0,5 point par centimètre.
height = 51.2

[physics]
width = 68.3           # du museau à la fesse : environ 136,5 cm, hors queue
stride = 36.8          # 0,5 × 1,6 × 46 cm (épaule au sol)

# Les huit sons du Mannequin, domaine public (voir CREDITS.md), et la
# sonnaille : trois coups de la plus grosse cloche d'un troupeau de
# 300 moutons réuni avant la transhumance (BigSoundBank n° 2971, CC0), les
# autres cloches atténuées derrière. Elle sonne quand il se met en marche,
# trotte, court, saute, se secoue ou tape du pied, et parfois en broutant ;
# pas à chaque pas.
[sounds]
bele = { files = ["sons/mouton-1.mp3", "sons/mouton-2.mp3", "sons/mouton-3.mp3", "sons/mouton-4.mp3"], volume = 0.6, mouth = true }
broute = { files = ["sons/broute-1.mp3", "sons/broute-2.mp3"], volume = 0.5 }
pose = { files = ["sons/pose-1.mp3", "sons/pose-2.mp3"], volume = 0.5 }
sonnaille = { files = ["sons/sonnaille-1.mp3", "sons/sonnaille-2.mp3", "sons/sonnaille-3.mp3"], volume = 0.45 }

[reflexes]
spawn = "fall"
fall = "fall"
land = [{ to = "land", weight = 1 }]
land_hard = "land_hard"
held = "held"
thrown = "fall"
edge = [{ to = "turn", weight = 8 }, { to = "hop_down", weight = 1 }, { to = "leap", weight = 1 }]
wall = "turn"
# Élevé à la main, il regarde ou renifle avant de s'écarter.
poke = [{ to = "sniff", weight = 5 }, { to = "look", weight = 3 }, { to = "bleat", weight = 1 }]
# Une fenêtre plus haute, toute proche : sauter sur son rebord s'il est à
# portée (sinon, le moteur ne le propose pas), ou faire demi-tour.
window_side = [{ to = "turn", weight = 4 }, { to = "leap", weight = 1 }]
meet = [{ to = "sniff", weight = 6 }, { to = "look", weight = 2 }, { to = "bleat", weight = 1 }]
together = "pronk"
leave = "hop"
# Le floucat est le dernier à détaler ; une vraie alarme reste possible.
startle = [{ to = "look", weight = 8 }, { to = "stamp", weight = 1 }, { to = "run", weight = 0.5 }]
sleepy = "yawn"
wake = [{ to = "stretch", weight = 3 }, { to = "sit", weight = 1 }]
wind = [{ to = "turn_away", weight = 4, when = "into_wind" }, { to = "brace", weight = 1 }]

[[behavior]]
name = "stand"
motion = "stand"
duration = [1.5, 4.0]
next = [
    { to = "walk", weight = 10 },
    { to = "graze", weight = 3 },
    { to = "look", weight = 3 },
    { to = "sit", weight = 2 },
    { to = "shake", weight = 1 },
    { to = "scratch", weight = 1 },
    { to = "bleat", weight = 0.5 },
    { to = "sniff", weight = 5, when = "cursor_near:220" },
    { to = "pronk", weight = 0.5, when = "lively" },
    { to = "gambol", weight = 0.5, when = "lively" },
    { to = "pivot", weight = 0.3, when = "lively" },
    { to = "race", weight = 0.5, when = ["lively", "evening"] },
    { to = "trot", weight = 1, when = "lively" },
    { to = "ruminate", weight = 5, when = "calm" },
    { to = "yawn", weight = 1, when = "calm" },
]

# Le redon gêne les arrêts pour brouter : bouchées brèves, puis il repart.
[[behavior]]
name = "graze"
motion = "graze"
duration = [3.0, 7.0]
sound = [{ name = "broute", chance = 0.3 }, { name = "sonnaille", chance = 0.15 }]
next = [{ to = "walk", weight = 6 }, { to = "stand", weight = 2 }, { to = "look", weight = 1 }]

[[behavior]]
name = "look"
motion = "look"
duration = [1.5, 3.5]
contagious = 0.4
next = [{ to = "walk", weight = 5 }, { to = "stand", weight = 3 }, { to = "sniff", weight = 2 }]

# Il conduit le troupeau : longues marches, départ souvent imité.
# Vitesses du Mannequin mises à l'échelle du stride ; voir README.md.
[[behavior]]
name = "walk"
motion = "walk"
speed = 58.4
duration = [5.0, 14.0]
contagious = 0.65
sound = { name = "sonnaille", chance = 0.2 }
next = [
    { to = "walk", weight = 5 },
    { to = "stand", weight = 3 },
    { to = "graze", weight = 2 },
    { to = "turn", weight = 2 },
    { to = "look", weight = 1 },
    { to = "sit", weight = 1 },
    { to = "trot", weight = 1 },
]

[[behavior]]
name = "trot"
motion = "walk"
speed = 101.5
duration = [2.0, 5.0]
sound = { name = "sonnaille", chance = 0.4 }
next = [{ to = "walk", weight = 5 }, { to = "stand", weight = 2 }]

[[behavior]]
name = "run"
motion = "run"
speed = 190.3
duration = [1.0, 2.0]
contagious = 0.6
sound = { name = "sonnaille", chance = 0.6 }
next = [{ to = "look", weight = 4 }, { to = "walk", weight = 3 }, { to = "turn", weight = 2 }]

[[behavior]]
name = "turn"
motion = "turn"
duration = 0.35
next = [{ to = "walk", weight = 5 }, { to = "stand", weight = 2 }]

# Il chôme et rumine couché ; les regroupements sont ceux du moteur.
[[behavior]]
name = "sit"
motion = "sit"
duration = [7.0, 15.0]
next = [
    { to = "ruminate", weight = 6 },
    { to = "stretch", weight = 2 },
    { to = "stand", weight = 2 },
    { to = "sleep", weight = 2 },
    { to = "sleep", weight = 6, when = "night" },
    { to = "sleep", weight = 12, when = "away" },
]

[[behavior]]
name = "ruminate"
motion = "sit"
chew = true
duration = [15.0, 32.0]
next = [{ to = "sit", weight = 3 }, { to = "stretch", weight = 2 }, { to = "stand", weight = 1 }, { to = "sleep", weight = 8, when = "away" }]

[[behavior]]
name = "sleep"
motion = "sleep"
duration = [20.0, 50.0]
next = "sit"

[[behavior]]
name = "hop"
motion = "jump"
jump = [70.0, 400.0]
duration = "forever"
sound = { name = "sonnaille", chance = 0.5 }

[[behavior]]
name = "hop_down"
motion = "jump"
jump = [110.0, 230.0]
duration = "forever"
sound = { name = "sonnaille", chance = 0.5 }

# Sauter sur une fenêtre plus haute, toute proche, comme un mouflon sur un
# rocher (docs/animation-animale.md, « Sauter sur un rebord plus haut »). Une
# race de plaine, lourde, qui saute peu. Portée : 1,6 longueur de patte, soit
# 74 cm (une fois sa hauteur au garrot, 75 cm). Le saut : mesurer le rebord
# du regard, reculer pour prendre son élan si besoin, se ramasser, bondir.
[[behavior]]
name = "leap"
motion = "leap"
reach = 1.6
duration = "forever"
on_land = "leap_land"

# La réception, sabots plantés ; puis repartir sur le rebord, ou regarder
# autour de soi.
[[behavior]]
name = "leap_land"
motion = "stand"
duration = 0.3
sound = [{ name = "pose", chance = 0.6 }, { name = "sonnaille", chance = 0.4 }]
next = [{ to = "walk", weight = 3 }, { to = "look", weight = 2 }]

# Quelques jeux conservés pour le tempérament actif et les aperçus.
# Cet adulte castré n'a ni charge ni enchaînement de coups de front.
[[behavior]]
name = "pronk"
motion = "pronk"
duration = "forever"
contagious = 0.25
sound = { name = "sonnaille", chance = 0.6 }

[[behavior]]
name = "gambol"
motion = "pronk"
twist = true
jump = [40.0, 370.0]
duration = "forever"
contagious = 0.25
sound = { name = "sonnaille", chance = 0.6 }
on_land = [{ to = "land", weight = 5 }, { to = "gambol", weight = 1 }, { to = "stand", weight = 2 }]

[[behavior]]
name = "pivot"
motion = "pronk"
spin = true
jump = [0.0, 300.0]
duration = "forever"
on_land = [{ to = "land", weight = 4 }, { to = "stand", weight = 2 }]

[[behavior]]
name = "race"
motion = "run"
speed = 177.7
duration = [1.2, 2.2]
contagious = 0.5
sound = { name = "sonnaille", chance = 0.6 }
on_edge = "race_turn"
on_wall = "race_turn"
next = [{ to = "race_turn", weight = 2 }, { to = "stand", weight = 3 }]

[[behavior]]
name = "race_turn"
motion = "turn"
duration = 0.35
next = [{ to = "race", weight = 2 }, { to = "stand", weight = 2 }]

# L'aperçu jeux demande ces noms : il recule puis renifle, sans duel.
[[behavior]]
name = "play_back"
motion = "back"
speed = 30.0
duration = 1.1
next = "sniff"

[[behavior]]
name = "back_up"
motion = "back"
speed = 35.0
duration = [1.0, 1.6]
next = "stand"

[[behavior]]
name = "fall"
motion = "fall"
duration = "forever"

[[behavior]]
name = "land"
motion = "land"
duration = 0.35
sound = [{ name = "pose", chance = 0.6 }, { name = "sonnaille", chance = 0.4 }]
next = [{ to = "stand", weight = 5 }, { to = "look", weight = 2 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "land_hard"
motion = "land"
duration = 0.9
sound = [{ name = "pose" }, { name = "sonnaille", chance = 0.8 }, { name = "bele", chance = 0.3 }]
next = [{ to = "daze", weight = 3 }, { to = "look", weight = 1 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "held"
motion = "held"
duration = "forever"
sound = [{ name = "bele", chance = 0.3 }, { name = "sonnaille", chance = 0.5 }]

[[behavior]]
name = "shake"
motion = "shake"
duration = 0.9
sound = { name = "sonnaille", chance = 0.9 }
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 3 }, { to = "graze", weight = 1 }]

[[behavior]]
name = "stretch"
motion = "stretch"
duration = 2.4
next = [{ to = "shake", weight = 2 }, { to = "walk", weight = 3 }, { to = "graze", weight = 1 }]

[[behavior]]
name = "scratch"
motion = "scratch"
duration = [1.4, 2.4]
next = [{ to = "stand", weight = 2 }, { to = "graze", weight = 2 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "yawn"
motion = "yawn"
duration = 1.6
contagious = 0.2
next = [{ to = "stand", weight = 2 }, { to = "sit", weight = 4 }, { to = "sit", weight = 12, when = "away" }]

[[behavior]]
name = "bleat"
motion = "bleat"
duration = 0.85
sound = "bele"
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 3 }, { to = "look", weight = 1 }]

[[behavior]]
name = "sniff"
motion = "sniff"
duration = [1.0, 2.0]
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 4 }, { to = "bleat", weight = 0.5 }]

# Castré, il ne fait pas le flehmen du bélier qui flaire une brebis : la
# lèvre reste articulée, sans comportement qui la retrousse.

[[behavior]]
name = "stamp"
motion = "stamp"
duration = 0.9
sound = { name = "sonnaille", chance = 0.5 }
next = [{ to = "look", weight = 5 }, { to = "stand", weight = 2 }, { to = "run", weight = 0.5 }]

[[behavior]]
name = "daze"
motion = "daze"
duration = [1.6, 2.6]
next = [{ to = "shake", weight = 3 }, { to = "stand", weight = 1 }]

[[behavior]]
name = "turn_away"
motion = "turn"
duration = 0.35
next = "brace"

[[behavior]]
name = "brace"
motion = "brace"
duration = [2.5, 5.0]
next = [{ to = "shake", weight = 2 }, { to = "stand", weight = 2 }, { to = "walk", weight = 1 }]

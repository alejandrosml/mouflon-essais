# Swaledale : un bélier (« tup ») de deux à trois ans, en octobre, en
# toison d'automne, dessiné en vecteurs d'après docs/races/swaledale.md.
# Le comportement reprend le Mannequin, réglé sur la fiche (§ 8) : vif,
# rustique et attentif, il fait face à l'intrus et tape du pied avant de
# céder ; bon marcheur, il alterne pâture et rumination. Les troupeaux de
# colline s'égaillent en été et se resserrent devant le chien. Le moteur
# traduit cette vigilance et l'entraînement du groupe ; il ne simule pas
# l'attachement au quartier de lande (« hefting »).

[pet]
# Trois brebis pour un bélier ; chacun porte le dessin de son sexe, et
# l'agneau le sien.
sex = { male = 0.25 }
id = "swaledale"
name = "Swaledale"
author = "Alejandro San Martin Lamas"
description = "Le Swaledale des landes du Yorkshire : vif et rustique, face noire, museau blanc et yeux cerclés de blanc, pattes mouchetées et longue queue laineuse ; cornes rondes brun caramel pour le bélier, fines et courtes pour la brebis."
version = "0.1.0"
license = "MIT OR Apache-2.0"
category = "sheep"
region = "british-isles"

[appearance]
rig = "swaledale.svg"
# 0,5 point par cm : 72 cm au garrot, environ 91,7 cm des sabots au haut
# de la tête et des cornes. Le dessin est à 1 unité = 1 cm.
height = 45.9

# Agneau Swaledale de deux semaines : 37 cm au garrot, face presque toute noire, sans cornes.
[appearance.lamb]
rig = "swaledale-agneau.svg"
height = 23.075
width = 23.358
stride = 22.020

# Brebis Swaledale : 62 cm au garrot, cornes minces d'un demi-tour à trois quarts de tour, tête plus fine.
[appearance.female]
rig = "swaledale-brebis.svg"
height = 39.495
width = 47.766
stride = 34.444

[physics]
width = 57.2           # encombrement du profil, queue et cornes comprises : environ 114,4 cm
stride = 40.0          # 1,6 × 25 pt : 50 cm de l'épaule au sol, à l'échelle 0,5

# Sons du Mannequin, domaine public (CREDITS.md) : des enregistrements
# ordinaires de moutons, aucune voix documentée propre au Swaledale.
# `mouth = true` : il ouvre la bouche en bêlant. Pas de sonnaille.
[sounds]
bele = { files = ["sons/mouton-1.mp3", "sons/mouton-2.mp3", "sons/mouton-3.mp3", "sons/mouton-4.mp3"], lamb = ["sons/agneau-1.mp3"], volume = 0.7, mouth = true }
broute = { files = ["sons/broute-1.mp3", "sons/broute-2.mp3"], volume = 0.5 }
pose = { files = ["sons/pose-1.mp3", "sons/pose-2.mp3"], volume = 0.5 }

[reflexes]
spawn = "fall"
fall = "fall"
land = [{ to = "land", weight = 1 }]
land_hard = "land_hard"
held = "held"
thrown = "fall"
# Pied sûr sur les pentes : il descend parfois du rebord.
edge = [
    { to = "turn", weight = 4 },
    { to = "hop_down", weight = 1.5 },
    { to = "leap", weight = 3 },
]
wall = "turn"
# Peu manipulé, mais il fait face avant de céder (fiche § 8.3 et § 8.5).
poke = [
    { to = "look", weight = 5 },
    { to = "stamp", weight = 3 },
    { to = "hop", weight = 1 },
    { to = "bleat", weight = 1 },
    { to = "run", weight = 1 },
    { to = "paw", weight = 2, when = "rowdy" },
]
# Une fenêtre plus haute, toute proche : sauter sur son rebord s'il est à
# portée (sinon, le moteur ne le propose pas), ou faire demi-tour.
window_side = [{ to = "turn", weight = 2 }, { to = "leap", weight = 3 }]
# Il renifle ses voisins ; les béliers actifs se mesurent du front.
meet = [
    { to = "sniff", weight = 5 },
    { to = "look", weight = 2 },
    { to = "bleat", weight = 1 },
    { to = "play_back", weight = 2, when = "lively" },
    { to = "play_back", weight = 4, when = "rowdy" },
]
together = "pronk"
leave = "hop"
# L'intrus attire d'abord le regard, puis l'alarme ; la fuite reste courte.
startle = [
    { to = "look", weight = 6 },
    { to = "stamp", weight = 3 },
    { to = "run", weight = 2 },
    { to = "hop", weight = 1 },
]
sleepy = "yawn"
wake = [{ to = "stretch", weight = 3 }, { to = "sit", weight = 1 }]
# Rustique, il reste dehors : il tourne le dos au vent avant de se ramasser.
wind = [{ to = "turn_away", weight = 5, when = "into_wind" }, { to = "brace", weight = 1 }]

[[behavior]]
name = "stand"
motion = "stand"
duration = [1.5, 4.0]
next = [
    { to = "walk", weight = 6 },
    { to = "graze", weight = 8 },
    { to = "look", weight = 6 },
    { to = "sit", weight = 2 },
    { to = "trot", weight = 1 },
    { to = "shake", weight = 1 },
    { to = "scratch", weight = 1 },
    { to = "bleat", weight = 1 },
    { to = "look", weight = 6, when = "cursor_near:220" },
    { to = "paw", weight = 3, when = "rowdy" },
    # Le bélier adulte joue moins qu'un agneau ; les actifs le font encore.
    { to = "pronk", weight = 1, when = "lively" },
    { to = "gambol", weight = 1, when = "lively" },
    { to = "pivot", weight = 1, when = "lively" },
    { to = "race", weight = 1, when = "lively" },
    { to = "race", weight = 2, when = ["lively", "evening"] },
    { to = "trot", weight = 2, when = "lively" },
    { to = "ruminate", weight = 3, when = "calm" },
    { to = "yawn", weight = 1, when = "calm" },
]

[[behavior]]
name = "graze"
motion = "graze"
duration = [6.0, 16.0]
sound = { name = "broute", chance = 0.35 }
next = [
    { to = "stand", weight = 2 },
    { to = "walk", weight = 4 },
    { to = "look", weight = 3 },
    { to = "scratch", weight = 1 },
    { to = "look", weight = 5, when = "cursor_near:220" },
]

[[behavior]]
name = "look"
motion = "look"
duration = [2.0, 4.5]
contagious = 0.35
next = [
    { to = "stand", weight = 3 },
    { to = "walk", weight = 3 },
    { to = "graze", weight = 3 },
    { to = "stamp", weight = 1 },
    { to = "sit", weight = 1 },
    { to = "bleat", weight = 1 },
]

[[behavior]]
name = "walk"
motion = "walk"
# Pas long et franc (fiche § 8.5) ; vitesses du Mannequin × stride / 29.
speed = 64.0
duration = [3.0, 9.0]
contagious = 0.25
next = [
    { to = "stand", weight = 4 },
    { to = "graze", weight = 4 },
    { to = "look", weight = 3 },
    { to = "turn", weight = 2 },
    { to = "sit", weight = 1 },
    { to = "trot", weight = 1 },
]

[[behavior]]
name = "trot"
motion = "walk"
speed = 110.0
duration = [2.0, 5.0]
next = [{ to = "walk", weight = 3 }, { to = "stand", weight = 2 }, { to = "run", weight = 1 }]

[[behavior]]
name = "run"
motion = "run"
speed = 207.0
duration = [1.0, 2.2]
contagious = 0.5
# Après une courte fuite, il se retourne pour surveiller l'intrus.
next = [{ to = "turn", weight = 3 }, { to = "look", weight = 3 }, { to = "stand", weight = 2 }, { to = "trot", weight = 1 }]

[[behavior]]
name = "turn"
motion = "turn"
duration = 0.35
next = [{ to = "walk", weight = 3 }, { to = "stand", weight = 2 }, { to = "look", weight = 2 }]

[[behavior]]
name = "sit"
motion = "sit"
duration = [5.0, 12.0]
next = [
    { to = "stand", weight = 3 },
    { to = "stretch", weight = 2 },
    { to = "ruminate", weight = 4 },
    { to = "sleep", weight = 2 },
    { to = "sleep", weight = 6, when = "night" },
    { to = "sleep", weight = 12, when = "away" },
]

[[behavior]]
name = "ruminate"
motion = "sit"
chew = true
duration = [12.0, 28.0]
next = [
    { to = "sit", weight = 2 },
    { to = "stretch", weight = 2 },
    { to = "stand", weight = 1 },
    { to = "sleep", weight = 1 },
    { to = "sleep", weight = 8, when = "away" },
]

[[behavior]]
name = "sleep"
motion = "sleep"
duration = [25.0, 55.0]
next = [{ to = "sit", weight = 1 }]

[[behavior]]
name = "hop"
motion = "jump"
jump = [75.0, 420.0]
duration = "forever"

[[behavior]]
name = "hop_down"
motion = "jump"
jump = [120.0, 245.0]
duration = "forever"

# Sauter sur une fenêtre plus haute, toute proche, comme un mouflon sur un
# rocher (docs/animation-animale.md, « Sauter sur un rebord plus haut »). Une
# race de colline ou de montagne, sûre de pied, qui franchit les murets.
# Portée : 2,2 longueurs de patte, soit 110 cm (1,5 fois sa hauteur au
# garrot, 72 cm). Le saut : mesurer le rebord du regard, reculer pour prendre
# son élan si besoin, se ramasser, bondir.
[[behavior]]
name = "leap"
motion = "leap"
reach = 2.2
duration = "forever"
on_land = "leap_land"

# La réception, sabots plantés ; puis repartir sur le rebord, ou regarder
# autour de soi.
[[behavior]]
name = "leap_land"
motion = "stand"
duration = 0.3
sound = { name = "pose", chance = 0.6 }
next = [{ to = "walk", weight = 3 }, { to = "look", weight = 2 }]

[[behavior]]
name = "pronk"
motion = "pronk"
duration = "forever"
contagious = 0.25

[[behavior]]
name = "gambol"
motion = "pronk"
twist = true
jump = [50.0, 390.0]
duration = "forever"
contagious = 0.25
on_land = [
    { to = "land", weight = 4 },
    { to = "gambol", weight = 1 },
    { to = "pivot", weight = 1 },
    { to = "race", weight = 1 },
]

[[behavior]]
name = "pivot"
motion = "pronk"
spin = true
jump = [0.0, 310.0]
duration = "forever"
on_land = [{ to = "land", weight = 3 }, { to = "gambol", weight = 1 }, { to = "race", weight = 1 }]

[[behavior]]
name = "race"
motion = "run"
speed = 193.0
duration = [1.2, 2.2]
contagious = 0.45
on_edge = "race_turn"
on_wall = "race_turn"
next = [{ to = "race_turn", weight = 2 }, { to = "gambol", weight = 1 }, { to = "stand", weight = 2 }]

[[behavior]]
name = "race_turn"
motion = "turn"
duration = 0.35
next = [{ to = "race", weight = 2 }, { to = "stand", weight = 1 }]

[[behavior]]
name = "play_back"
motion = "back"
speed = 36.0
duration = 1.1
next = "play_lunge"

[[behavior]]
name = "play_lunge"
motion = "charge"
speed = 152.0
duration = 0.8
on_meet = "play_butt"
next = [{ to = "stand", weight = 2 }, { to = "gambol", weight = 1 }]

[[behavior]]
name = "play_butt"
motion = "stand"
duration = [0.4, 0.7]
sound = { name = "pose", chance = 0.7 }
next = [
    { to = "shake", weight = 2 },
    { to = "sniff", weight = 1 },
    { to = "gambol", weight = 1 },
    { to = "stand", weight = 2 },
]

[[behavior]]
name = "play_invite"
motion = "invite"
duration = 1.4
next = [{ to = "stand", weight = 2 }, { to = "gambol", weight = 1 }, { to = "look", weight = 1 }]

[[behavior]]
name = "fall"
motion = "fall"
duration = "forever"

[[behavior]]
name = "land"
motion = "land"
duration = 0.35
sound = { name = "pose", chance = 0.6 }
next = [{ to = "stand", weight = 5 }, { to = "look", weight = 2 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "land_hard"
motion = "land"
duration = 0.9
sound = [{ name = "pose" }, { name = "bele", chance = 0.4 }]
next = [{ to = "daze", weight = 3 }, { to = "look", weight = 1 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "held"
motion = "held"
duration = "forever"
sound = { name = "bele", chance = 0.5 }

[[behavior]]
name = "shake"
motion = "shake"
duration = 0.9
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "graze", weight = 1 }]

[[behavior]]
name = "stretch"
motion = "stretch"
duration = 2.4
next = [{ to = "shake", weight = 2 }, { to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "graze", weight = 1 }]

[[behavior]]
name = "scratch"
motion = "scratch"
duration = [1.4, 2.4]
next = [{ to = "stand", weight = 2 }, { to = "graze", weight = 2 }, { to = "shake", weight = 1 }]

[[behavior]]
name = "yawn"
motion = "yawn"
duration = 1.6
contagious = 0.15
next = [
    { to = "stand", weight = 3 },
    { to = "look", weight = 1 },
    { to = "sit", weight = 1 },
    { to = "sit", weight = 12, when = "away" },
]

[[behavior]]
name = "bleat"
motion = "bleat"
duration = 0.85
sound = "bele"
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "look", weight = 1 }]

[[behavior]]
name = "sniff"
motion = "sniff"
duration = [1.0, 2.0]
next = [
    { to = "stand", weight = 2 },
    { to = "walk", weight = 2 },
    { to = "graze", weight = 1 },
    { to = "bleat", weight = 1 },
    { to = "flehmen", weight = 1 },
    { to = "flehmen", weight = 2, when = "rowdy" },
]

[[behavior]]
name = "flehmen"
motion = "flehmen"
duration = [7.0, 12.0]   # 7 à 19 s en moyenne chez de jeunes béliers (Bahadi 2023) : le bas, pour un bureau
next = [{ to = "stand", weight = 2 }, { to = "walk", weight = 2 }, { to = "bleat", weight = 1 }]

[[behavior]]
name = "stamp"
motion = "stamp"
duration = 0.9
next = [
    { to = "look", weight = 4 },
    { to = "stand", weight = 2 },
    { to = "run", weight = 2 },
    { to = "paw", weight = 2, when = "rowdy" },
]

[[behavior]]
name = "paw"
motion = "paw"
duration = [1.1, 2.2]
next = [{ to = "back_up", weight = 5 }, { to = "charge", weight = 1 }, { to = "stand", weight = 2 }]

[[behavior]]
name = "back_up"
motion = "back"
speed = 47.0
duration = [1.0, 1.6]
# Le bélier recule puis charge, sans cabré (fiche § 8.4, estimation).
next = [
    { to = "charge", weight = 5 },
    { to = "stand", weight = 2 },
    { to = "charge", weight = 3, when = "rowdy" },
]

[[behavior]]
name = "rear"
# Geste du Mannequin conservé pour l'aperçu ; aucun réflexe ni
# enchaînement de ce bélier ne le choisit (fiche § 8.4).
motion = "rear"
duration = 1.15
next = "charge"

[[behavior]]
name = "charge"
motion = "charge"
speed = 234.0
duration = [0.8, 1.4]
next = [{ to = "stand", weight = 2 }, { to = "shake", weight = 1 }, { to = "walk", weight = 1 }]

[[behavior]]
name = "daze"
motion = "daze"
duration = [1.6, 2.6]
next = [{ to = "shake", weight = 3 }, { to = "stand", weight = 1 }]

[[behavior]]
name = "turn_away"
motion = "turn"
duration = 0.35
next = "brace"

[[behavior]]
name = "brace"
motion = "brace"
duration = [2.0, 4.0]
next = [{ to = "shake", weight = 2 }, { to = "stand", weight = 2 }, { to = "walk", weight = 1 }]
